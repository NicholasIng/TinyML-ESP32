; Week 6b: the whole chain on the board (log-mel -> int8 model -> calibration and score),
; run on MIMII clips stored in flash and compared with Python by src/test_device.py.
; First:  python src/test_device.py --prepare      (writes firmware/generated/)
; Then:   pio run -t upload                        (inside firmware/device_test)
; Then:   python src/test_device.py

[env:esp32s3]
platform = espressif32@8.0.0   ; ESP-IDF 6.1.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files = ../generated/bench_clips.raw   ; also listed in src/CMakeLists.txt
monitor_speed = 921600

; Same firmware with TFLite Micro's plain reference kernels instead of ESP-NN, to measure
; what ESP-NN changes (speed, rounding):  pio run -e esp32s3_ref -t upload
[env:esp32s3_ref]
extends = env:esp32s3
board_build.cmake_extra_args = -DESP_NN_OFF_PROBE=1
